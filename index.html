<script>
"use strict";
/* ============ sabitler ============ */
var MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
var DAYS3=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
var SHIFTS={1:{name:"Vardiya 1",hours:"08:00-17:30"},2:{name:"Vardiya 2",hours:"17:30-02:30"}};
var DEFAULT_PRODUCTS=[["Hücre Ribonlu","Kg"],["Hücre Ribonsuz","Kg"],["Ön Cam","Adet"],["Arka Cam","Adet"],["Ribbon 0,26mm","Kg"],
 ["Busbar 4mm (0,30)","Kg"],["Busbar 6mm (0,30)","Kg"],["Eva (2. Encapsulant)","Kg"],["Epe (1. Encapsulant)","Kg"],["Çerçeve Uzun","Adet"],
 ["Çerçeve Kısa","Adet"],["J-Box","Adet"],["Silikon-Sealant","Kg"],["Potting A-B","Kg"],["Ribbon Makarası","Adet"],["Busbar Makarası","Adet"]];
var DEFAULT_DOC={title:"HAMMADDE FİRE TAKİP DOSYASI",docNo:"ÜD-LS-001",effective:"2025-01-21",rev:"0",revDate:"2027-01-04",page:"1",preparedBy:"M. Mücahit DANIŞAN"};
var PAGES=[
 ["ana","Ana Sayfa",""],["fire","Fire Girişi","Günlük, vardiya vardiya fire girişi"],["atik","Atık Gönderimi","Gönderilen atıkları tek tek gir"],
 ["devir","Önceki Yıl Devir","Geçen yıldan kalan fire miktarı"],["haftalik","Haftalık Form","Haftayı seç, formu Excel olarak al"],
 ["aylik","Aylık Rapor","Ay seç, ürün bazında toplam fire"],["yillik","Yıllık Rapor","Devir, yıllık fire, atık ve net kalan"],
 ["amir","Amir Raporu","Tarih aralığında toplam fire"],["urun","Ürün Listesi","Ürünler, birimler, belge bilgileri"],["excel","Excel Aktarımı","Excel dosyasından al, Excel'e ver"],["users","Kullanıcı Yönetimi","Kullanıcı ekle, yetki ver ve pasife al"]];

/* ============ durum ============ */
var S={db:null,user:null,dl:null,canWrite:true,role:"personel",year:2027,
  products:null,docinfo:null,fire:{},waste:{},carry:{},rows:[],loaded:{},route:"ana",
  fireDate:null,weekIdx:null,month:null,amir:{from:"",to:""},wFilter:"all",flash:null,importPlan:null,imp:null};
var unsubs=[];

/* ============ yardımcılar ============ */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function iso(y,m,d){return y+"-"+pad(m)+"-"+pad(d)}
function dFromISO(s){var p=s.split("-");return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]))}
function toISO(dt){return dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-"+pad(dt.getUTCDate())}
function addDays(s,n){var d=dFromISO(s);d.setUTCDate(d.getUTCDate()+n);return toISO(d)}
function dow(s){return dFromISO(s).getUTCDay()}
function trDate(s){if(!s)return "";var p=s.split("-");return p[2]+"."+p[1]+"."+p[0]}
function todayISO(){var d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())}
var nf3=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:3});
var nf0=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0});
function fnum(v,zeroDash){if(v==null||v==="")return "";if(zeroDash&&Math.abs(v)<1e-9)return "–";return nf3.format(Math.round(v*1000)/1000)}
function isKg(p){return p&&String(p.unit).toLowerCase()==="kg"}
function repUnit(p){return isKg(p)?"kg":"adet"}
function toRep(p,v){return isKg(p)?v/1000:v}
function pById(id){var l=S.products&&S.products.list||[];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}
function pByName(n){var l=S.products&&S.products.list||[];var k=String(n||"").trim().toLowerCase();for(var i=0;i<l.length;i++)if(l[i].name.trim().toLowerCase()===k)return l[i];return null}
function parseQty(str){
  var s=String(str==null?"":str).trim();
  if(s==="")return {empty:true};
  if(s.charAt(0)==="=")s=s.slice(1);
  s=s.replace(/\s/g,"").replace(/,/g,".");
  if(!/^[0-9+\-*\/().]+$/.test(s))return {bad:true};
  var v;try{v=Function('"use strict";return ('+s+')')()}catch(e){return {bad:true}}
  if(typeof v!=="number"||!isFinite(v)||v<0)return {bad:true};
  return {value:Math.round(v*1e6)/1e6};
}
function inNum(v){return v==null?"":String(v).replace(".",",")}
function setSave(kind,text){var c=$("#savechip");c.className="chip "+(kind||"");c.textContent=text}
function weeksOf(year){
  var first=year+"-01-01",d=dow(first);var back=d===0?6:d-1;var mon=addDays(first,-back);var out=[];
  while(mon<=year+"-12-31"){var fri=addDays(mon,4);out.push({mon:mon,fri:fri,label:weekLabel(mon,fri)});mon=addDays(mon,7)}
  return out;
}
function weekLabel(mon,fri){
  var a=dFromISO(mon),b=dFromISO(fri);
  var da=pad(a.getUTCDate()),db_=pad(b.getUTCDate());
  if(a.getUTCFullYear()!==b.getUTCFullYear())return da+" "+MONTHS[a.getUTCMonth()]+" "+a.getUTCFullYear()+" - "+db_+" "+MONTHS[b.getUTCMonth()]+" "+b.getUTCFullYear();
  if(a.getUTCMonth()!==b.getUTCMonth())return da+" "+MONTHS[a.getUTCMonth()]+" - "+db_+" "+MONTHS[b.getUTCMonth()]+" "+b.getUTCFullYear();
  return da+"-"+db_+" "+MONTHS[b.getUTCMonth()]+" "+b.getUTCFullYear();
}

/* ============ veri katmanı ============ */
function rebuildRows(){
  var out=[];
  Object.keys(S.fire).forEach(function(id){
    var d=S.fire[id];if(!d||!d.date||!d.values)return;
    Object.keys(d.values).forEach(function(pid){var v=d.values[pid];if(typeof v==="number")out.push({date:d.date,shift:d.shift,pid:pid,v:v})});
  });
  S.rows=out;
}
function aggregate(from,to){
  var m={};
  S.rows.forEach(function(r){
    if(r.date<from||r.date>to)return;
    var o=m[r.pid]||(m[r.pid]={v1:0,v2:0});
    if(r.shift===1)o.v1+=r.v;else o.v2+=r.v;
  });
  return m;
}
function wasteTotals(from,to){
  var m={};Object.keys(S.waste).forEach(function(id){var w=S.waste[id];if(!w||(from&&w.date<from)||(to&&w.date>to))return;m[w.pid]=(m[w.pid]||0)+(+w.qty||0)});return m;
}
function carryFor(year){var c=S.carry[String(year-1)];return c&&c.values?c:{values:{},notes:{}}}
var queues={};
function enqueue(key,fn){
  var p=(queues[key]||Promise.resolve()).then(fn);
  queues[key]=p.catch(function(){});
  return p;
}
function wrap(promise,okText){
  setSave("busy","Kaydediliyor…");
  return promise.then(function(r){setSave("ok",okText||"Kaydedildi");return r}).catch(function(e){
    var c=e&&e.code,msg=e&&e.message||"";
    setSave("err",c==="invalid_argument"?"Kayıt yetkiniz yok":c==="quota_exceeded"?"Veritabanı kotası dolu":"Kaydedilemedi ("+(c||"hata")+")");
    throw e;
  });
}
function writeFire(docId,date,shift,pid,value,note){
  var ref=S.db.doc("fire/"+docId);
  return wrap(S.db.runTransaction(function(tx){return tx.get(ref).then(function(snap){
    var cur=snap.exists?snap.data():{date:date,shift:shift,values:{},notes:{}};
    var values=Object.assign({},cur.values||{}),notes=Object.assign({},cur.notes||{});
    if(value===null)delete values[pid];else if(value!==undefined)values[pid]=value;
    if(note!==undefined){if(note==="")delete notes[pid];else notes[pid]=note}
    if(!Object.keys(values).length&&!Object.keys(notes).length){if(snap.exists)tx.delete(ref);return;}
    tx.set(ref,{date:date,shift:shift,values:values,notes:notes,createdBy:cur.createdBy||S.user.email,updatedAt:new Date().toISOString(),updatedBy:S.user.email,updatedByName:S.user.displayName||S.user.email},{merge:true});
  })}),"Kaydedildi");
}
function setDoc(path,data){return enqueue(path,function(){return wrap(S.db.doc(path).set(Object.assign({},data,{updatedAt:new Date().toISOString(),updatedBy:S.user.email}),{merge:true}))})}

/* ============ bağlantı ============ */
function subscribe(){
  var timer=setTimeout(function(){if(!S.loaded.fire)$("#connchip").textContent="Veritabanına şu an ulaşılamıyor"},10000);
  function mark(k){S.loaded[k]=true;var all=S.loaded.fire&&S.loaded.waste&&S.loaded.carry&&S.loaded.config;
    if(all){clearTimeout(timer);var c=$("#connchip");c.className="chip ok";c.textContent="Ortak veritabanı bağlı"}}
  function err(e){var c=$("#connchip");c.className="chip err";c.textContent="Veri okunamadı ("+(e&&e.code||"hata")+")"}

V.yillik=function(){

    var a=yr[p.id]||{v1:0,v2:0},v1=toRep(p,a.v1),v2=toRep(p,a.v2),tot=v1+v2,dv=+c.values[p.id]||0,all=tot+dv,wst=wt[p.id]||0,net=all-wst;

      t.value=inNum(r.value);t.parentNode.classList.add("has");
      writeFire(t.dataset.doc,date,sh,t.dataset.pid,r.value,undefined);
    }else writeFire(t.dataset.doc,date,sh,t.dataset.pid,undefined,t.value.trim());
    return;
  }
  if(t.dataset.cpid){
    var y=S.year-1,cur=carryFor(S.year),vals=Object.assign({},cur.values),notes=Object.assign({},cur.notes||{});
    if(t.dataset.k==="v"){var r2=parseQty(t.value);if(r2.bad){setSave("err","Geçersiz sayı");return}if(r2.empty)delete vals[t.dataset.cpid];else{vals[t.dataset.cpid]=r2.value;t.value=inNum(r2.value)}}
    else{if(t.value.trim()==="")delete notes[t.dataset.cpid];else notes[t.dataset.cpid]=t.value.trim()}

  if(t.dataset.pi!=null){
    var list=S.products.list.map(function(p){return Object.assign({},p)}),i=+t.dataset.pi;

    setDoc("config/products",{list:list});return;
  }
  if(t.dataset.di){
    var d=Object.assign({},DEFAULT_DOC,S.docinfo||{});d[t.dataset.di]=t.value;setDoc("config/docinfo",d);return;
  }
});

/* ============ Excel okuma ============ */
function cellVal(ws,r,c){var a=XLSX.utils.encode_cell({r:r-1,c:c-1}),x=ws[a];return x?x.v:undefined}
function cellDate(v){
  if(v==null||v==="")return null;
  if(typeof v==="number"&&v>20000&&v<80000){var o=XLSX.SSF.parse_date_code(v);return iso(o.y,o.m,o.d)}
  if(v instanceof Date)return iso(v.getFullYear(),v.getMonth()+1,v.getDate());
  var s=String(v).trim(),m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);if(m)return iso(+m[3],+m[2],+m[1]);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];return null;
}
function cellNum(v){if(typeof v==="number")return v;if(v==null)return null;var r=parseQty(v);return r.value!=null?r.value:null}
function findSheet(wb,name){var k=wb.SheetNames.filter(function(n){return n.trim().toLowerCase()===name.toLowerCase()})[0];return k?wb.Sheets[k]:null}
function readExcel(file){
  var err=$("#imp-err");err.innerHTML="";S.importPlan=null;S.imp=null;
  if(!file)return render();
  if(typeof XLSX==="undefined"){err.innerHTML='<div class="msg bad">Excel okuyucu yüklenemedi (internet bağlantısı gerekir).</div>';return}
  var fr=new FileReader();
  fr.onerror=function(){err.innerHTML='<div class="msg bad">Dosya okunamadı.</div>'};
  fr.onload=function(){
    try{
      var wb=XLSX.read(fr.result,{type:"array",cellDates:false});
      var pl={fileName:file.name,products:[],docinfo:null,fire:{},fireCells:0,waste:[],carry:{year:S.year-1,values:{},notes:{}},skipped:0};
      var up=findSheet(wb,"Ürün Listesi");
      if(!up)throw new Error("“Ürün Listesi” sayfası bulunamadı. Bu dosya Fire Takip dosyası değil gibi görünüyor.");
      for(var r=4;r<=60;r++){var n=cellVal(up,r,1);if(n==null||String(n).trim()===""||/BELGE B/i.test(String(n)))break;var u=String(cellVal(up,r,2)||"Adet").trim();pl.products.push({name:String(n).trim(),unit:/^kg$/i.test(u)?"Kg":"Adet"})}
      var di={},hasDoc=false;
      for(var r2=20;r2<=40;r2++){var k=String(cellVal(up,r2,1)||"").trim(),v=cellVal(up,r2,2);if(!k||v==null)continue;
        if(/Dosya Ba/i.test(k)){di.title=String(v);hasDoc=true}else if(/Dok.man No/i.test(k)){di.docNo=String(v);hasDoc=true}else if(/Y.r.rl.k/i.test(k)){di.effective=cellDate(v)||"";hasDoc=true}
        else if(/Rev/i.test(k)){di.rev=String(v);hasDoc=true}else if(/Sayfa/i.test(k)){di.page=String(v);hasDoc=true}else if(/Haz.rlayan/i.test(k)){di.preparedBy=String(v);hasDoc=true}}
      if(hasDoc)pl.docinfo=Object.assign({},DEFAULT_DOC,di);
      var nameToId={},existing=(S.products&&S.products.list)||[];
      pl.products.forEach(function(p,i){var m=existing.filter(function(e){return e.name.trim().toLowerCase()===p.name.toLowerCase()})[0];p.id=m?m.id:"p"+(i+1)});
      var used={};pl.products.forEach(function(p){used[p.id]=1});
      pl.products.forEach(function(p,i){if(used[p.id]&&pl.products.filter(function(q){return q.id===p.id}).length>1)p.id="p"+(100+i)});
      pl.products.forEach(function(p){nameToId[p.name.toLowerCase()]=p.id});
      var fs=findSheet(wb,"Fire Girişi");
      if(fs){var rng=XLSX.utils.decode_range(fs["!ref"]);
        for(var i=4;i<=rng.e.r+1;i++){
          var val=cellVal(fs,i,7);if(val==null||val==="")continue;
          var q=cellNum(val),date=cellDate(cellVal(fs,i,1)),sv=String(cellVal(fs,i,3)||""),sh=/2/.test(sv)?2:/1/.test(sv)?1:0,pid=nameToId[String(cellVal(fs,i,5)||"").trim().toLowerCase()];
          if(q==null||q<0||!date||!sh||!pid){pl.skipped++;continue}
          var key=date+"_"+sh,d=pl.fire[key]||(pl.fire[key]={date:date,shift:sh,values:{},notes:{}});
          d.values[pid]=Math.round(q*1e6)/1e6;pl.fireCells++;
          var nt=cellVal(fs,i,8);if(nt!=null&&String(nt).trim()!=="")d.notes[pid]=String(nt).trim();
        }}
      var as=findSheet(wb,"Atık Girişi");
      if(as){var r3=XLSX.utils.decode_range(as["!ref"]);
        for(var j=4;j<=r3.e.r+1;j++){
          var q3=cellNum(cellVal(as,j,3)),pn=cellVal(as,j,2);if(q3==null&&(pn==null||pn===""))continue;
          var dt=cellDate(cellVal(as,j,1)),pid3=nameToId[String(pn||"").trim().toLowerCase()];
          if(q3==null||!(q3>0)||!dt||!pid3){pl.skipped++;continue}
          pl.waste.push({date:dt,pid:pid3,qty:q3,ref:String(cellVal(as,j,5)||"").trim(),buyer:String(cellVal(as,j,6)||"").trim(),note:String(cellVal(as,j,7)||"").trim()});
        }}
      var cs=findSheet(wb,"Önceki Yıl Devir");
      if(cs){var cy=cellVal(cs,2,2);if(typeof cy==="number")pl.carry.year=cy;
        for(var k2=4;k2<=60;k2++){var cn=cellVal(cs,k2,1);if(cn==null||String(cn).trim()==="")break;var cp=nameToId[String(cn).trim().toLowerCase()],cv=cellNum(cellVal(cs,k2,3));
          if(cp&&cv!=null)pl.carry.values[cp]=cv;var cnote=cellVal(cs,k2,4);if(cp&&cnote!=null&&String(cnote).trim()!=="")pl.carry.notes[cp]=String(cnote).trim()}}
      S.importPlan=pl;render();
    }catch(ex){S.importPlan=null;render();$("#imp-err").innerHTML='<div class="msg bad">'+esc(ex.message||"Dosya okunamadı")+'</div>'}
  };
  fr.readAsArrayBuffer(file);
}
function doImport(){
  var pl=S.importPlan;if(!pl||!S.canWrite)return;
  var prog=$("#imp-prog"),tasks=[];
  function t(fn){tasks.push(fn)}
  var list=pl.products.map(function(p){return {id:p.id,name:p.name,unit:p.unit}});
  var curIds={};((S.products&&S.products.list)||[]).forEach(function(p){curIds[p.id]=1});
  ((S.products&&S.products.list)||[]).forEach(function(p){if(!list.some(function(q){return q.id===p.id}))list.push(p)});
  t(function(){return S.db.doc("config/products").set({list:list})});
  if(pl.docinfo)t(function(){return S.db.doc("config/docinfo").set(pl.docinfo)});
  Object.keys(pl.fire).forEach(function(k){
    var inc=pl.fire[k];
    t(function(){return enqueue("fire/"+k,function(){
      var cur=S.fire[k]||{values:{},notes:{}},values=Object.assign({},cur.values||{},inc.values),notes=Object.assign({},cur.notes||{},inc.notes);
      return S.db.doc("fire/"+k).set({date:inc.date,shift:inc.shift,values:values,notes:notes,updatedAt:new Date().toISOString()});
    })});
  });
  var have={};Object.keys(S.waste).forEach(function(id){var w=S.waste[id];have[w.date+"|"+w.pid+"|"+w.qty+"|"+(w.ref||"")]=1});
  var addedW=0;pl.waste.forEach(function(w){var key=w.date+"|"+w.pid+"|"+w.qty+"|"+w.ref;if(have[key])return;have[key]=1;addedW++;t(function(){return S.db.collection("waste").add(Object.assign({createdAt:new Date().toISOString()},w))})});
  if(Object.keys(pl.carry.values).length)t(function(){return S.db.doc("carry/"+pl.carry.year).set({year:pl.carry.year,values:pl.carry.values,notes:pl.carry.notes})});
  var total=tasks.length,done=0,failed=0,i=0;
  setSave("busy","Aktarılıyor…");setImp("","Aktarılıyor: 0 / "+total);
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
  function run(fn,tries){return fn().catch(function(e){if(tries>0&&e&&(e.code==="resource_exhausted"||e.code==="unavailable"))return sleep(700+Math.random()*600).then(function(){return run(fn,tries-1)});throw e})}
  function worker(){
    if(i>=tasks.length)return Promise.resolve();
    var fn=tasks[i++];
    return run(fn,4).then(function(){done++},function(){failed++}).then(function(){setImp("","Aktarılıyor: "+(done+failed)+" / "+total);return worker()});
  }
  Promise.all([worker(),worker(),worker(),worker()]).then(function(){
    setSave(failed?"err":"ok",failed?failed+" kayıt aktarılamadı":"Aktarım tamamlandı");
    setImp(failed?"bad":"ok",failed?(done+" kayıt aktarıldı, "+failed+" kayıt aktarılamadı. Aynı dosyayı yeniden seçip tekrar deneyebilirsiniz."):("Tamamlandı: "+done+" kayıt aktarıldı"+(addedW<pl.waste.length?" (tekrar eden "+(pl.waste.length-addedW)+" atık kaydı atlandı)":"")+"."));
  });
}

function saveXlsx(wb,name,msgEl){var buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1500);msgEl&&(msgEl.innerHTML='<div class="msg ok">Dosya indirildi: '+esc(name)+'</div>');}
function doExport(){

  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(wr),"Atık Girişi");
  var c=carryFor(S.year),cr=[["Ürün","Rapor Birimi","Devreden Miktar (kg / adet)","Açıklama","Devir yılı",S.year-1]];
  plist.forEach(function(p){cr.push([p.name,repUnit(p),c.values[p.id]==null?"":c.values[p.id],c.notes&&c.notes[p.id]||""])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cr),"Önceki Yıl Devir");
  var y=S.year,yr=aggregate(y+"-01-01",y+"-12-31"),wt=wasteTotals(y+"-01-01",y+"-12-31"),mon=[];
  for(var m=1;m<=12;m++){var r=monthRange(y,m);mon.push(aggregate(r[0],r[1]))}
  var yh=[["Ürün","Birim"].concat(MONTHS,["Yıllık V1","Yıllık V2","Yıllık Toplam","Devir","Toplam Fire","Gönderilen Atık","Net Kalan Fire"])];
  plist.forEach(function(p){var line=[p.name,repUnit(p)];mon.forEach(function(g){var a=g[p.id]||{v1:0,v2:0};line.push(toRep(p,a.v1+a.v2))});
    var a=yr[p.id]||{v1:0,v2:0},v1=toRep(p,a.v1),v2=toRep(p,a.v2),dv=+c.values[p.id]||0,wst=wt[p.id]||0;line.push(v1,v2,v1+v2,dv,v1+v2+dv,wst,v1+v2+dv-wst);yh.push(line)});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(yh),"Yıllık Rapor");
  var pr=[["Ürün Adı","Giriş Birimi","Ne yazılır?","Rapor Birimi"]];plist.forEach(function(p){pr.push([p.name,p.unit,isKg(p)?"Gram yaz":"Adet yaz",repUnit(p)])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pr),"Ürün Listesi");
  saveXlsx(wb,"Hammadde_Fire_Takip_"+S.year+"_"+todayISO()+".xlsx",msg);
}

/* ============ Google Firebase başlangıç ============ */
function showLogin(message){$("#login-screen").style.display="grid";$("#application").style.display="none";var e=$("#login-error");e.hidden=!message;e.textContent=message||"";}
function showApp(){$("#login-screen").style.display="none";$("#application").style.display="grid";}
function boot(){
 $("#todaychip").textContent="Bugün: "+trDate(todayISO())+" "+DAYS[dow(todayISO())];var ys=$("#yearsel"),opts="";for(var y=2026;y<=2035;y++)opts+='<option value="'+y+'"'+(y===S.year?" selected":"")+'>'+y+'</option>';ys.innerHTML=opts;route();render();
 if(!window.firebase||!firebase.apps||!firebase.apps.length){showLogin("firebase-config.js ayarlarını doldurun.");return;}
 $("#google-login").addEventListener("click",function(){firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){showLogin("Giriş başarısız: "+e.message);});});
 $("#logout-btn").addEventListener("click",function(){firebase.auth().signOut();});
 firebase.auth().onAuthStateChanged(function(user){if(!user){S.db=null;S.user=null;S.canWrite=false;showLogin();return;}var email=(user.email||"").toLowerCase(),db=firebase.firestore();db.collection("users").doc(email).get().then(function(doc){if(!doc.exists||doc.data().active!==true){firebase.auth().signOut();showLogin("Bu hesap yetkili değil. Yöneticinizden kullanıcı eklemesini isteyin.");return;}var p=doc.data();S.db=db;S.user={uid:user.uid,email:email,displayName:user.displayName||email};S.role=p.role||"personel";S.canWrite=(S.role==="personel"||S.role==="admin");$("#userchip").textContent=email+" · "+({personel:"Personel",amir:"Amir",admin:"Yönetici"}[S.role]||S.role);showApp();route();render();subscribe();loadUsers();}).catch(function(e){showLogin("Yetki kontrolü başarısız: "+e.message);});});
}
